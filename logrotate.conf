# logrotate.conf - Placeholder for log rotation configuration
#
# This file is intended to be placed in /etc/logrotate.d/high-throughput-io inside the VM.
# For now, it just contains a comment.

/var/log/high-throughput-io/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 ubuntu adm
    sharedscripts
    postrotate
        systemctl reload orchestrator.service >/dev/null 2>&1 || true
        systemctl reload worker.service >/dev/null 2>&1 || true
    endscript
}